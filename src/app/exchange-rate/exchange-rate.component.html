<!-- <div class="container" *ngIf="allUsers"> -->
<div class="row mt-3">
    <div class="col-md-6 text-start">
        <!-- <h5>All Users</h5> -->
        <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input>
        </mat-form-field>
    </div>
    <div class="col-md-6 text-end">
        <a type="button" class="btn btn-sm btn-success" (click)="openPopup()">Enter New Exchange Rate</a>
    </div>
</div>

<!-- The Modal -->
<div class="modal" tabindex="-1" role="dialog" style="background: rgb(0 0 0 / 80%);"
    [ngStyle]="{'display':displayStyle}">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h6 class="modal-title">Enter New Exchange Rate</h6>
                <button type="button" class="btn-close" (click)="closePopup()"></button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <div class="row mx-5">
                    <!-- <div class="col-md-4"></div> -->
                    <!-- <div class="col-md-10"> -->
                        <input typze="text" [(ngModel)]="exchangeRate.rate" class="form-control">
                        <span class="text-danger" *ngIf="!validateRateMessage.validation">{{validateRateMessage.message}}</span>
                    <!-- </div> -->
                    <!-- <div class="col-md-2"> -->
                        
                    <!-- </div> -->
                </div>
                <p *ngIf="resultStatus.success == false" class="text-danger ps-3">{{resultStatus.message}}</p>
            </div>
            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-success" (click)="saveExchangerate()">Save</button>
                <button type="button" class="btn btn-danger" (click)="closePopup()">Cancel</button>
            </div>
        </div>
    </div>
</div>
<!-- The Modal END -->


<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns; let x = index"></tr>
        <!-- ID Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Sr. No. </th>
            <td mat-cell *matCellDef="let row; let s = index"> {{s+1}} </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="rate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Rate </th>
            <td mat-cell *matCellDef="let row"> {{row.rate}}</td>
        </ng-container>

        <!-- Shipping Cost Column -->
        <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Created On </th>
            <td mat-cell *matCellDef="let row"> {{row.created_at}} </td>
        </ng-container>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[25, 50, 75, 100]" aria-label="Select page of users"></mat-paginator>
</div>
<!-- </div> -->
<div class="w-100 bg-white display-1 d-flex align-items-center justify-content-center flex-column" style="height: 50vh;"
    *ngIf="!allExchangeRates">
    <div><i class="fa-light fa-spinner-third fa-spin"></i></div>
    <div class="display-6 mt-5">Loading Users...</div>
</div>
