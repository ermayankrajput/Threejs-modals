<div class="row mt-3">
    <div class="col-md-6 text-start">
        <h5>Update my profile</h5>
    </div>
    <div class="col-md-6 text-end">
        <a routerLink="/user-list" class="btn btn-sm btn-success">Back</a>
    </div>
</div>
<div class="row d-flex justify-content-center align-items-center h-100 mt-5">
    <div class="col col-xl-6">
        <div class="card" style="border-radius: 1rem;">
            <div class="card-body p-4 p-lg-5 text-black">
                <div class="form-outline mb-4">
                    <label class="form-label">First Name</label>
                    <span class="text-danger ps-3"
                        *ngIf="!validateFirstNameMessage.validation">{{validateFirstNameMessage.message}}</span>
                    <input type="text" [(ngModel)]="user.first_name" class="form-control form-control" />
                </div>
                <div class="form-outline mb-4">
                    <label class="form-label">Last Name</label>
                    <span class="text-danger ps-3"
                        *ngIf="!validateLastNameMessage.validation">{{validateLastNameMessage.message}}</span>
                    <input type="text" [(ngModel)]="user.last_name" class="form-control form-control" />
                </div>
                <div class="form-outline mb-4">
                    <label class="form-label">Email</label>
                    <div style="border: 1px solid #dcdcdc;border-radius: 5px;padding: 6px 12px;background: #cfcfcf;">{{user.email}}</div>
                </div>
                <!-- <div class="form-outline mb-4">
                    <label class="form-label">Age</label>
                    <select class="form-select" name="age" [(ngModel)]="user.age">
                        <option *ngFor="let age of ageList" [value]="age">{{age}}</option>
                    </select>
                </div> -->
                <div class="d-flex align-items-center">
                    <div class="pt-1 mb-4">
                        <button class="btn btn-dark btn-lg btn-block" type="button" (click)="submitForm()">Update
                            User</button>
                    </div>
                    <p *ngIf="resultStatus.success == false" class="text-danger ps-3">{{resultStatus.message}}</p>
                    <p *ngIf="resultStatus.success == true" class="text-success ps-3">{{resultStatus.message}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
